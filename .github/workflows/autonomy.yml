name: Autonomous runtime
on:
  pull_request:
    paths:
      - '.agents/**'
      - 'docs/agents/**'
      - '.github/workflows/autonomy.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
concurrency:
  group: autonomy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  offline-runtime:
    strategy:
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline claims, failures, and full delivery simulation
        shell: bash
        run: bash .agents/scripts/dry-run.sh
      - name: Shell syntax
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          for script in .agents/scripts/*.sh; do bash -n "$script"; done
