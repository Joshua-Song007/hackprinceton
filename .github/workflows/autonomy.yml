name: Autonomous runtime
on:
  pull_request:
    paths:
      - '.agents/**'
      - 'docs/agents/**'
      - '.github/workflows/autonomy.yml'
  push:
    branches: [main]
    paths:
      - '.agents/**'
      - 'docs/agents/**'
      - '.github/workflows/autonomy.yml'
permissions:
  contents: read
jobs:
  offline-runtime:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline claims, failures, and full delivery simulation
        shell: bash
        run: bash .agents/scripts/dry-run.sh
      - name: Shell syntax
        shell: bash
        run: |
          for script in .agents/scripts/*.sh; do bash -n "$script"; done
