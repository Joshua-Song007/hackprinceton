name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash .agents/scripts/verify-swift.sh
      - run: bash .agents/scripts/verify-nonswift.sh
      - run: bash .agents/scripts/check-docs.sh
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .agents/scripts/verify-backend.sh
