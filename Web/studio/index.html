<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pear Studio</title>
  <link rel="icon" type="image/svg+xml" href="/pear-studio-icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M7.1 2.2a1 1 0 0 1 1.8 0l5.6 10.3a1 1 0 0 1-.9 1.5H2.4a1 1 0 0 1-.9-1.5zM7.25 6v3.6h1.5V6zm0 4.8v1.5h1.5v-1.5z" fill-rule="evenodd"/></symbol>
  <symbol id="i-cube" viewBox="0 0 16 16"><path d="M8 1.8l5.5 3v6.4L8 14.2l-5.5-3V4.8zM2.5 4.8L8 7.9l5.5-3.1M8 7.9v6.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
  <symbol id="i-airpods" viewBox="0 0 16 16"><path d="M4.5 2.5a2 2 0 0 1 2 2v1.6a2 2 0 0 1-1.1 1.8v5.6M11.5 2.5a2 2 0 0 0-2 2v1.6a2 2 0 0 0 1.1 1.8v5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="i-watch" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="8" height="8" rx="2.2"/><path d="M6 4V1.8h4V4M6 12v2.2h4V12"/></g></symbol>
  <symbol id="i-phone" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8"/><path d="M7 3.6h2" stroke-linecap="round"/></g></symbol>
  <symbol id="i-script" viewBox="0 0 16 16"><path d="M5.5 4.5L2.5 8l3 3.5M10.5 4.5L13.5 8l-3 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
</svg>
<div id="studio" data-studio>
  <nav class="om-menubar" id="menubar" role="menubar" aria-label="Application menu"></nav>
  <header class="om-toolbar" id="toolbar" data-mode="sim" role="toolbar" aria-label="Studio toolbar"></header>
  <main id="dock" aria-label="Panels"></main>
  <footer class="om-statusbar" id="statusbar" data-mode="sim" aria-label="Status"></footer>
</div>
<div id="screen" class="scr" hidden></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
<noscript>Pear Studio needs JavaScript.</noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
