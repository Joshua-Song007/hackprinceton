# Desktop shell for Pear Studio. Separate Cargo project: not part of Backend/. All Studio logic stays in the web build.
[package]
name = "pear-studio"
version = "0.1.0"
description = "Pear Studio desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["rustls-tls"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Marketplace bundles (Phase 10): gzip tarballs checked against their SHA-256 and the registry's Ed25519
# signature before anything is unpacked. All but ed25519-dalek were already in Cargo.lock.
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
ed25519-dalek = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
