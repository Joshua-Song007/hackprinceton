<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Draw - referee</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #111; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
  body { display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; gap: 16px; min-height: 100vh; transition: background .05s; }
  body.fire { background: #d00; }
  #conn { font-size: 18px; color: #f66; } #conn.ok { color: #6c6; }
  #phase { font-size: 56px; font-weight: 800; text-transform: uppercase; }
  #round, #needs, #result { font-size: 36px; }
  #lobby { font-size: 32px; line-height: 1.5; }
  #scores { font-size: 72px; font-weight: 800; }
  #start { flex: 1; min-height: 220px; font-size: 96px; font-weight: 900; border: 0; border-radius: 40px; background: #2a7; color: #fff; }
  #audio { font-size: 18px; color: #fc6; }
</style>
</head>
<body>
<div id="conn">starting…</div>
<div id="phase">lobby</div>
<div id="round"></div>
<div id="needs"></div>
<div id="lobby"></div>
<div id="scores"></div>
<div id="result"></div>
<div id="audio">Tap Start once to enable sound.</div>
<button id="start">START</button>
<script src="qd-client.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let audio = null, players = [];

// Unlocks Web Audio and speechSynthesis; both need a user gesture on iOS Safari.
function unlockAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx) { audio = audio || new Ctx(); audio.resume(); }
  if (window.speechSynthesis) {
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  }
  $("audio").textContent = audio ? "" : "audio not supported on this browser";
}

function tone(freq, startS, durS, type, endFreq) {
  if (!audio) return;
  const t0 = audio.currentTime + startS;
  const osc = audio.createOscillator(), gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (endFreq) osc.frequency.linearRampToValueAtTime(endFreq, t0 + durS);
  gain.gain.setValueAtTime(1, t0);
  gain.gain.linearRampToValueAtTime(0, t0 + durS);
  osc.connect(gain).connect(audio.destination);
  osc.start(t0);
  osc.stop(t0 + durS);
}
const sayFire = () => {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance("Fire!");
  u.volume = 1; u.rate = 1.2;
  speechSynthesis.speak(u);
};

const nameOf = (id) => (players.find((p) => p.id === id) || {}).name || "?";

function render(s) {
  players = s.players || [];
  $("phase").textContent = s.phase;
  $("round").textContent = s.round ? "Round " + s.round : "";
  $("needs").textContent = s.needs || "";
  $("lobby").innerHTML = "";
  for (const p of players) {
    const row = document.createElement("div");
    row.textContent = `${p.name} (${p.role || "?"})${p.role === "phone" ? (p.ready ? " - READY" : " - not ready") : ""}`;
    $("lobby").appendChild(row);
  }
  const phones = players.filter((p) => p.role === "phone");
  $("scores").textContent = phones.map((p) => `${p.name} ${s.scores && s.scores[p.id] || 0}`).join("   |   ");
  $("start").textContent = s.phase === "matchOver" ? "REMATCH" : "START";
  if (s.phase !== "fire") document.body.classList.remove("fire");
}

const qd = QD.connect({
  role: "ref",
  onStatus: (t, ok) => { $("conn").textContent = t; $("conn").className = ok ? "ok" : ""; },
  onEvent(name, data) {
    if (name === "state") render(data);
    else if (name === "fire") {
      document.body.classList.add("fire");
      tone(1000, 0, 0.8, "square");
      sayFire();
    } else if (name === "roundResult") {
      const times = Object.entries(data.reactionMs || {}).map(([id, ms]) => `${nameOf(id)} ${ms === null ? "-" : ms + " ms"}`).join(", ");
      $("result").textContent = `Round ${data.round}: ${nameOf(data.winnerId)} wins${data.reason === "foul" ? " (other player fouled)" : ""}. ${times}`;
      if (data.reason === "foul") tone(220, 0, 0.6, "sawtooth", 90);
    } else if (name === "matchOver") {
      $("result").textContent = `MATCH OVER - ${nameOf(data.winnerId)} wins!`;
      [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.8 + i * 0.18, 0.3, "triangle")); // after any foul tone
    }
  },
});

$("start").addEventListener("click", () => {
  unlockAudio();
  $("result").textContent = "";
  qd.send("start", {});
});
</script>
</body>
</html>
