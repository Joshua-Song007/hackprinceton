<!doctype html><html data-theme="dark"><head><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="../project/components/bundle.css"><meta charset="utf-8"><title>InspectorSection</title></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z"/></symbol><symbol id="i-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></symbol><symbol id="i-chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol><symbol id="i-warn" viewBox="0 0 16 16"><path d="M7.1 2.2a1 1 0 0 1 1.8 0l5.6 10.3a1 1 0 0 1-.9 1.5H2.4a1 1 0 0 1-.9-1.5zM7.25 6v3.6h1.5V6zm0 4.8v1.5h1.5v-1.5z" fill-rule="evenodd"/></symbol><symbol id="i-airpods" viewBox="0 0 16 16"><path d="M4.5 2.5a2 2 0 0 1 2 2v1.6a2 2 0 0 1-1.1 1.8v5.6M11.5 2.5a2 2 0 0 0-2 2v1.6a2 2 0 0 0 1.1 1.8v5.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol><symbol id="i-watch" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="8" height="8" rx="2.2"/><path d="M6 4V1.8h4V4M6 12v2.2h4V12"/></g></symbol><symbol id="i-phone" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8"/><path d="M7 3.6h2" stroke-linecap="round"/></g></symbol><symbol id="i-pencil" viewBox="0 0 16 16"><path d="M3 13l.9-3.1 7.3-7.3a1.1 1.1 0 0 1 1.6 0l.6.6a1.1 1.1 0 0 1 0 1.6l-7.3 7.3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol><symbol id="i-cube" viewBox="0 0 16 16"><path d="M8 1.8l5.5 3v6.4L8 14.2l-5.5-3V4.8zM2.5 4.8L8 7.9l5.5-3.1M8 7.9v6.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol><symbol id="i-dot" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.5"/></symbol></svg>
<div style="max-width:300px;border-right:1px solid var(--line)"><div class="om-section"><button aria-expanded="true"><svg class="om-icon om-chev" aria-hidden="true"><use href="#i-chev"/></svg>Transform</button><div class="om-section-body"><div class="om-prop om-prop--vec"><span class="om-prop-label"><span>Position</span><span>m</span></span><div class="om-vec"><label class="om-field"><span class="om-axis om-axis--x" title="Drag to change X">X</span><input id="ax" value="2.40" data-step="0.01" aria-label="Position X"></label><label class="om-field"><span class="om-axis om-axis--y" title="Drag to change Y">Y</span><input id="ay" value="1.10" data-step="0.01" aria-label="Position Y"></label><label class="om-field"><span class="om-axis om-axis--z" title="Drag to change Z">Z</span><input id="az" value="-3.00" data-step="0.01" aria-label="Position Z"></label></div></div><div class="om-prop om-prop--vec"><span class="om-prop-label"><span>Rotation</span><span>°</span></span><div class="om-vec"><label class="om-field"><span class="om-axis om-axis--x" title="Drag to change X">X</span><input id="bx" value="0.0" data-step="0.5" aria-label="Rotation X"></label><label class="om-field"><span class="om-axis om-axis--y" title="Drag to change Y">Y</span><input id="by" value="38.0" data-step="0.5" aria-label="Rotation Y"></label><label class="om-field"><span class="om-axis om-axis--z" title="Drag to change Z">Z</span><input id="bz" value="0.0" data-step="0.5" aria-label="Rotation Z"></label></div></div></div></div><div class="om-section"><button aria-expanded="true"><svg class="om-icon om-chev" aria-hidden="true"><use href="#i-chev"/></svg>Look-at trigger<span class=om-trail>onLookAt</span></button><div class="om-section-body"><div class="om-prop"><span>Lock angle</span><span style="color:var(--text)">15°</span></div><div class="om-prop"><span>Dwell</span><span style="color:var(--text)">0.5 s</span></div></div></div><div class="om-section"><button aria-expanded="false"><svg class="om-icon om-chev" aria-hidden="true"><use href="#i-chev"/></svg>Audio emitter</button><div class="om-section-body" hidden><div class="om-prop"><span>Sound</span><span style="color:var(--text)">growl.caf</span></div></div></div><div class="om-section"><button aria-expanded="false"><svg class="om-icon om-chev" aria-hidden="true"><use href="#i-chev"/></svg>Script</button><div class="om-section-body" hidden><div class="om-prop"><span>File</span><span style="color:var(--text)"><span style="color:var(--accent)">enemy.js</span></span></div></div></div></div>
<script>
document.querySelectorAll('.om-section > button').forEach(function (b) {
  b.addEventListener('click', function () {
    var open = b.getAttribute('aria-expanded') === 'true';
    b.setAttribute('aria-expanded', String(!open)); b.nextElementSibling.hidden = open;
  });
});
</script><script>
// Drag an axis letter to scrub its value (Shift = fine). Double-click resets to 0.
document.querySelectorAll('.om-axis').forEach(function (h) {
  var input = h.parentElement.querySelector('input'), step = parseFloat(input.dataset.step || '0.01');
  h.addEventListener('pointerdown', function (e) {
    h.setPointerCapture(e.pointerId); var x0 = e.clientX, v0 = parseFloat(input.value) || 0, dp = (String(step).split('.')[1] || '').length;
    function mv(ev) { input.value = (v0 + (ev.clientX - x0) * step * (ev.shiftKey ? 0.1 : 1)).toFixed(dp); }
    function up() { h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); }
    h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up);
  });
  h.addEventListener('dblclick', function () { input.value = (0).toFixed((String(step).split('.')[1] || '').length); });
});
</script>
</body></html>
