# Run from Deploy/: docker compose up -d --build   (vultr-bootstrap.sh does this and writes .env)
# .env keys: PEAR_DOMAIN, PEAR_DEV_SIGNIN, DATABASE_URL, PEAR_CORS_ORIGINS (optional),
# PEAR_CADDY_GLOBAL (local_certs when PEAR_DOMAIN is an IP), POSTGRES_PASSWORD and
# COMPOSE_PROFILES=localdb (only when no external DATABASE_URL).
# DATABASE_URL unset = the backend's in-memory store (data lost on restart).
# Marketplace (Phase 10): PEAR_S3_ENDPOINT, PEAR_S3_BUCKET, PEAR_S3_ACCESS_KEY, PEAR_S3_SECRET_KEY
# (Vultr Object Storage), PEAR_PLUGIN_SIGNING_KEY, PEAR_SECRET_KEY, PEAR_RUNTIME_SECRET (64 hex each,
# written by vultr-bootstrap.sh), PEAR_PLUGIN_REVIEWERS (account ids, optional).

services:
  backend:
    build:
      context: ..
      dockerfile: Deploy/Dockerfile
    env_file: .env
    environment:
      PORT: "8080"
      PEAR_STUDIO_DIR: /app/studio
      PEAR_AGENT_RUNTIME_URL: ws://runtime:9410/ws
      # Game-script ctx.agent.run uses an operator-paid model; needs the hosted runtime (PEAR_RUNTIME_SECRET).
      # Unset = ctx.agent.run rejects with "agent runtime not configured". Set both in .env:
      # PEAR_GAME_AGENT_PROVIDER: ${PEAR_GAME_AGENT_PROVIDER}
      # PEAR_GAME_AGENT_KEY: ${PEAR_GAME_AGENT_KEY}
      # Seeds the marketplace at startup so a fresh cloud box lists plugins (the seed job skips unchanged ones).
      PEAR_PLUGIN_SEED_DIR: /app/Plugins
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Hosted agent runtime: no published port, only the backend reaches it (with PEAR_RUNTIME_SECRET).
  runtime:
    build:
      context: ..
      dockerfile: Deploy/runtime.Dockerfile
    environment:
      PEAR_RUNTIME_SECRET: ${PEAR_RUNTIME_SECRET:?set PEAR_RUNTIME_SECRET in .env}
    volumes:
      - agent_projects:/data/projects
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9410/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: pear
      POSTGRES_DB: pear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pear -d pear"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PEAR_DOMAIN: ${PEAR_DOMAIN:-localhost}
      PEAR_CADDY_GLOBAL: ${PEAR_CADDY_GLOBAL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  agent_projects:
  pgdata:
  caddy_data:
  caddy_config:
