# Run from Deploy/: docker compose up -d --build   (vultr-bootstrap.sh does this and writes .env)
# .env keys: OMNI_DOMAIN, OMNI_DEV_SIGNIN, DATABASE_URL, OMNI_CORS_ORIGINS (optional),
# OMNI_CADDY_GLOBAL (local_certs when OMNI_DOMAIN is an IP), POSTGRES_PASSWORD and
# COMPOSE_PROFILES=localdb (only when no external DATABASE_URL, e.g. TigerData).
# DATABASE_URL unset = the backend's in-memory store (data lost on restart).

services:
  backend:
    build:
      context: ..
      dockerfile: Deploy/Dockerfile
    env_file: .env
    environment:
      PORT: "8080"
      OMNI_STUDIO_DIR: /app/studio
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16
    profiles: ["localdb"]
    environment:
      POSTGRES_USER: omni
      POSTGRES_DB: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OMNI_DOMAIN: ${OMNI_DOMAIN:-localhost}
      OMNI_CADDY_GLOBAL: ${OMNI_CADDY_GLOBAL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
