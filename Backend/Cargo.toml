[package]
name = "omni-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JS engine for server scripts: rquickjs is provisional (deno_core vs rquickjs not decided)
rquickjs = { version = "0.9", features = ["parallel"] }
