[project]
name = "omni-langchain-deepagents"
version = "0.7.39"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.38",
    "langchain-google-genai>=4.5.0",
    "langchain-openai>=1.8.0",
    "websockets",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["runtime"]
